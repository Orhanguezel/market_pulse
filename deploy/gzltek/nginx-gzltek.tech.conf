# gzltek.tech — market_pulse gzltek deploy
# /etc/nginx/sites-available/gzltek.tech -> sites-enabled symlink
# SSL satirlarini certbot enjekte eder. Ilk kurulumda bu dosya HTTP-only kalir.
#
# Topoloji:
#   /          -> public frontend (Next, 3077)
#   /panel/    -> admin panel (Next, 3096, NEXT_PUBLIC_BASE_PATH=/panel)
#   /api/      -> backend (Fastify, 8086)
#   /uploads/  -> backend (Fastify, 8086)
server {
  listen 80;
  server_name gzltek.tech www.gzltek.tech;
  client_max_body_size 50M;

  access_log /var/log/nginx/gzltek.tech.access.log;
  error_log  /var/log/nginx/gzltek.tech.error.log;

  location /api/ {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /panel {
    return 301 /panel/;
  }

  location /panel/ {
    proxy_pass http://127.0.0.1:3096;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:3077;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
  }
}
